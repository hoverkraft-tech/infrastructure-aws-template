# NOTE: please update this file according to your environment
#       and remove this comment
customer:
  name: acme
  domain: acme.net

name: tools
tags: {}

aws:
  account:
    name: tools
    id: "000000000000"
  control-tower:
    administrator-access-role-arn: arn:aws:iam::000000000000:role/OrganizationAccountAccessRole
  dns:
    domain: tools.aws.acme.net
  region: eu-west-3
  network:
    vpc:
      id: vpc-00000000000000000
      cidr: 10.0.0.0/16
    public:
      subnets:
        - availability-zone: eu-west-3a
          cidr: 10.1.3.0/24
        - availability-zone: eu-west-3b
          cidr: 10.1.4.0/24
        - availability-zone: eu-west-3c
          cidr: 10.1.5.0/24
    private:
      subnets:
        - availability-zone: eu-west-3a
          cidr: 10.1.0.0/24
        - availability-zone: eu-west-3b
          cidr: 10.1.1.0/24
        - availability-zone: eu-west-3c
          cidr: 10.1.2.0/24
  eks:
    cluster:
      name: tools
      version: '1.31'
      service-ipv4-cidr: 172.16.0.0/24
      endpoint:
        public-access: true
        public-access-cidrs:
          - 1.2.3.4/32    # example home
          - 5.6.7.8/32    # example vpn
        private-access: true
    addons:
      - name: vpc-cni
        version: v1.19.2-eksbuild.5
      - name: coredns
        version: v1.11.4-eksbuild.2
      - name: kube-proxy
        version: v1.31.3-eksbuild.2
      - name: aws-ebs-csi-driver
        version: v1.41.0-eksbuild.1
    node-groups:
      - name: workers
        ssh-public-key: |
          ssh-rsa  user@example.com
        ami-id: ami-00000000000000000 # anonymized
        availability-zones: ["eu-west-3a"]
        root-volume:
          size: 20
          type: gp3
        instance-type: t3.small
        desired-size: 1
        max-size: 1
        min-size: 1
